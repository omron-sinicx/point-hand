overview: |
  Imitation learning increasingly relies on novice operators, whose demonstrations fall short of experts' in number and inter-trial consistency.
  Operators act on what they are shown, yet how the rendering of the robot affects their demonstrations, and the policies trained on them, has not been examined.
  We study this question with **PointHand**, a teleoperation interface that renders a multi-fingered robot hand as sparse keypoints at its fingertips and joints, the same keypoints a policy can observe.
  In a simulated mug-in-box task, 18 novices and 4 experts collected 2,200 trials under three renderings: the real shape of the hand, all keypoints emphasized, or the thumb and index finger alone emphasized.
  The novices shown the thumb and index finger emphasized collected 441 successful demonstrations from 600 trials, against 320 for those shown the real shape.
  We then trained diffusion policies on these demonstrations, replacing the scene point cloud and proprioceptive state they observe with the hand keypoints and two object keypoints.
  Within 400 steps these demonstrations went from the weakest of the three novice conditions under the point-cloud policy (46.3%) to the strongest under the keypoint policy (57.3%), a gain of +11.0 percentage points in all five seeds.
  Those collected with all keypoints emphasized changed by at most +0.7 percentage points, and in no more than three seeds.
  The value of a demonstration therefore depends on the rendering shown during collection and on what the policy observes together.
  A shared representation can pay off on both sides, in the number of successful demonstrations and in the success rate of the policy trained on them.

body:
  - title: Visual Representation
    text: |
      PointHand replaces the robot hand shown to the operator with sparse keypoints at the fingertips and at the joints that bend each finger.
      We compare three renderings of the same hand: its real shape (Baseline), all keypoints emphasized (KP-Standard), and only the keypoints of the thumb and index finger emphasized (KP-Salient).
      Emphasized keypoints have a per-finger color that brightens when the finger comes close to the object, so the rendering also carries a contact cue.

      <img src="conditions.png" class="uk-align-center uk-responsive-width" alt="The robot hand rendered as its real shape, as keypoints with all emphasized, and as keypoints with only the thumb and index finger emphasized" />
      <span class="uk-text-meta">Robot hand presented to the operator: real shape (left, Baseline), all keypoints emphasized (center, KP-Standard), and only those of the thumb and index finger emphasized (right, KP-Salient). Fingertip keypoints are spheres and intermediate joint keypoints cubes. The others and the wrist keypoint, which the policy does not receive, are gray.</span>
  - title: Policy Learning
    text: |
      The keypoint positions are recorded with every demonstration, whether or not they were shown to the operator, so the same demonstrations can train two policies.
      DP3 observes the dense scene point cloud and the proprioceptive state.
      <span class="uk-text-nowrap">DP-KP</span> replaces both inputs with the hand keypoints and two object keypoints, and encodes each keypoint as one Transformer token so that the correspondence between tokens and robot parts is preserved.
      Both condition a diffusion head of the same architecture and share the training procedure.

      <img src="policy.png" class="uk-align-center uk-responsive-width" alt="Observation encoders of DP3 and DP-KP" />
      <span class="uk-text-meta">Observation encoding of the two policies. Top: DP3 uses the encoder of <a href="https://arxiv.org/abs/2403.03954">3D Diffusion Policy</a> (Ze et al., RSS 2024) on the scene point cloud and the state. Bottom: <span class="uk-text-nowrap">DP-KP</span> uses the encoder of <a href="https://arxiv.org/abs/2502.20391">Point Policy</a> (Haldar and Pinto, CoRL 2025) on the hand and object keypoints.</span>
  - title: Results
    text: |
      #### Demonstrations collected by the operators
      Novices shown KP-Salient succeeded in 73.5% of their trials on average, against 53.3% for those shown the real shape, and collected 441 successful demonstrations from 600 trials, against 320.

      <img src="result_study1.png" class="uk-align-center" style="width: 100%; max-width: 480px" alt="Success rate during collection per condition" />
      <span class="uk-text-meta">Success rate during collection, one value per participant (n = 6/6/6/4).</span>

      #### Success rate of the policies trained on them
      The same KP-Salient demonstrations were the weakest of the three novice conditions under DP3 within 400 steps and the strongest under <span class="uk-text-nowrap">DP-KP</span>.

      <div class="uk-overflow-auto">
        <table class="uk-table uk-table-small uk-text-small uk-table-divider">
          <thead>
            <tr>
              <th rowspan="2">Collection condition</th>
              <th colspan="3" class="uk-text-center">DP3</th>
              <th colspan="3" class="uk-text-center">DP-KP</th>
            </tr>
            <tr>
              <th>200</th><th>400</th><th>600</th>
              <th>200</th><th>400</th><th>600</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Baseline</td><td><b>24.7</b></td><td>47.7</td><td>53.3</td><td>25.7</td><td>56.3</td><td><b>65.0</b></td></tr>
            <tr><td>KP-Standard</td><td>22.7</td><td><b>54.0</b></td><td><b>61.7</b></td><td>19.0</td><td>53.7</td><td>62.3</td></tr>
            <tr class="uk-active"><td><b>KP-Salient</b></td><td><b>24.7</b></td><td>46.3</td><td>52.3</td><td><b>39.7</b></td><td><b>57.3</b></td><td><b>65.0</b></td></tr>
            <tr><td>Expert (reference)</td><td>39.0</td><td>62.0</td><td>65.7</td><td>44.3</td><td>70.0</td><td>77.0</td></tr>
          </tbody>
        </table>
      </div>
      <span class="uk-text-meta">Simulated success rate [%] within 200, 400, and 600 steps, mean over five seeds. Bold marks the highest value among the three novice conditions in each column.</span>

      <img src="result_study2.png" class="uk-align-center uk-responsive-width" alt="Simulated success rate of DP3 and DP-KP per collection condition" />
      <span class="uk-text-meta">Simulated success rate within 200, 400, and 600 steps, one panel per policy and one bar per collection condition. Error bars show the seed-to-seed standard deviation.</span>
  - title: Discussion
    text: |
      #### Implications
      The rendering shown during collection and the observation of the policy are worth choosing together.
      The same KP-Salient demonstrations were the weakest of the three novice conditions under DP3 within 400 steps (46.3%) and the strongest under <span class="uk-text-nowrap">DP-KP</span> (57.3%).
      A representation shared by the operator and the policy can also pay off on both sides at once, but only when it is designed well.
      For KP-Salient it paid off in the workload and the number of demonstrations during collection and in the success rate of <span class="uk-text-nowrap">DP-KP</span> afterwards.
      These results come from one task, one robot hand, and one participant pool per condition.

      #### Why did the keypoints help the operators?
      Under the keypoint renderings the rotation and finger paths were about 5 to 9% shorter than under the real shape, a difference within the between-participant spread.
      Two explanations fit it equally well: removing the self-occlusion that makes the operator move the hand aside to see behind it, and the visual contact cue.
      What separates the two keypoint conditions is perceptual load.
      KP-Salient reached a higher success rate during collection than KP-Standard and carried the lowest Mental Demand, while all four conditions used the middle, ring, and little fingers about 1.3 to 1.4 times as much as the thumb and index finger, so the emphasis did not suppress particular fingers.

      #### Sharing alone is not the point
      Neither policy followed the predicted order Baseline < KP-Standard < KP-Salient.
      Of the two conditions in which the operator saw the keypoints the policy receives, only the one that emphasized the thumb and index finger gained under <span class="uk-text-nowrap">DP-KP</span>.
      Which collection condition produced the better policy depended on the policy's observation.

      #### Limitations and future work
      Which keypoints to place and emphasize is still chosen by hand.
      Most participants moved the four fingers other than the thumb together, a grouping that differs from our emphasis, and another task, hand, or gripper will likely call for a different placement, so the keypoints should be designed automatically, for instance from a few demonstrations.
      The keypoints convey contact only by brightness and cannot show grip force or slip, and the rendering was manipulated only in simulation.
      On a physical robot the hand has to be removed from the camera image in real time, for which object removal with 3D Gaussian Splatting is a promising means.
